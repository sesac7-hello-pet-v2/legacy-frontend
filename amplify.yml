version: 1
frontend:
  phases:
    preBuild:
      commands:
        # 패키지 변경사항이 없으면 캐시에서 복원만
        - |
          if [ -f ".npm/_cacache/index-v5/last-update-check" ] && [ -f "package-lock.json" ]; then
            CACHED_HASH=$(cat .npm/package-lock-hash 2>/dev/null || echo "")
            CURRENT_HASH=$(sha256sum package-lock.json | cut -d' ' -f1)
            if [ "$CACHED_HASH" = "$CURRENT_HASH" ]; then
              echo "Package dependencies unchanged - using cache"
              cp -r .npm/node_modules . 2>/dev/null || true
            else
              echo "Package dependencies changed - installing"
              npm ci --cache .npm --prefer-offline --no-audit --no-fund
              echo "$CURRENT_HASH" > .npm/package-lock-hash
            fi
          else
            echo "First build - installing dependencies"
            npm ci --cache .npm --prefer-offline --no-audit --no-fund
            sha256sum package-lock.json | cut -d' ' -f1 > .npm/package-lock-hash
          fi
        # TypeScript 타입 체크 병렬 실행
        - npx tsc --noEmit &
    build:
      commands:
        # 개발용 소스맵 비활성화로 빌드 속도 향상
        - GENERATE_SOURCEMAP=false npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      # Next.js 캐시 (빌드 결과물)
      - .next/cache/**/*
      # npm 캐시 (패키지)
      - .npm/**/*
      # 패키지 해시 파일
      - .npm/package-lock-hash
      # TypeScript 빌드 정보 캐시
      - .next/cache/typescript/**/*
      # SWC 캐시
      - .next/cache/swc/**/*